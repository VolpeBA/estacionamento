spring.application.name=estapar
server.port=3003
spring.datasource.url=jdbc:mysql://localhost:3306/estapar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.threads.virtual.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
garage.simulator.base-url=http://localhost:3000
management.endpoints.web.exposure.include=health,info
logging.level.com.volpe=DEBUG
